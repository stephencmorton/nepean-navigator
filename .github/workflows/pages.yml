# Test pull requests and publish the static app to GitHub Pages from main.
name: Test and deploy Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Validate routing and offline caching before any deployment.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
  # Publish only the explicit app assets after tests pass on main.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Stage static assets
        run: |
          mkdir _site
          cp index.html app.js route-map.js routing.js data.js style.css manifest.webmanifest sw.js _site/
          cp -r icons _site/
          mkdir _site/public
          cp public/nepean_infographic.png public/share-qr.svg _site/public/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
